<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b55"><link rel="manifest" href="./manifest.json"><title>GreenHand Food Comparator</title><style>body{font:16px system-ui;margin:0;background:#f3f7f4;color:#17382f}header{background:#176b55;color:white;padding:18px max(16px,calc((100vw - 960px)/2));display:flex;justify-content:space-between}main{max-width:960px;margin:20px auto;padding:0 16px}.note,.card{padding:16px;border-radius:14px;margin:14px 0}.note{background:#fff0c7}.card{background:white;box-shadow:0 4px 18px #17382f12}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}form{display:grid;gap:9px}input,select,button{font:inherit;padding:10px;border:1px solid #ccd8d1;border-radius:8px}button{background:#176b55;color:white;border:0;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}li{padding:8px;border-bottom:1px solid #eee}.ok{color:#176b55}.bad{color:#a34b1c}</style></head><body><header><div><b>GreenHand</b><div id="subtitle"></div></div><select id="language"><option value="en">English</option><option value="fr">Français</option><option value="zh">中文</option></select></header><main><p class="note" id="disclaimer"></p><div class="grid"><section class="card"><h2 id="foodTitle"></h2><form id="foodForm"><input name="name" id="foodName" required><div class="row"><input name="amount" type="number" min="0" step=".1" required placeholder="g / ml"><select name="unit"><option>g</option><option>ml</option></select></div><select name="category" id="foodCategory"></select><button id="addFood"></button></form><ul id="foods"></ul></section><section class="card"><h2 id="ruleTitle"></h2><form id="ruleForm"><select name="category" id="ruleCategory"></select><div class="row"><input name="min" type="number" min="0" step=".1" required placeholder="Minimum"><input name="max" type="number" min="0" step=".1" required placeholder="Maximum"></div><button id="saveRule"></button></form><ul id="rules"></ul></section></div><section class="card"><h2 id="resultTitle"></h2><button id="compare"></button><ul id="results"></ul></section></main><script>
const T={en:{sub:'Personal food-group comparison',dis:'Use your own entries and rules. This tool is not medical advice or an official dietary standard.',food:'Food intake',rule:'My comparison rules',result:'Comparison',name:'Food name',add:'Add food',save:'Save rule',compare:'Compare amounts',none:'Nothing entered yet',within:'Within your rule',below:'Below your rule',above:'Above your rule'},fr:{sub:'Comparaison par groupes alimentaires',dis:'Saisissez vos aliments et vos règles. Outil sans conseil médical ni norme officielle.',food:'Aliments consommés',rule:'Mes règles de comparaison',result:'Résultat',name:'Nom de l’aliment',add:'Ajouter',save:'Enregistrer',compare:'Comparer les quantités',none:'Aucune saisie',within:'Dans votre règle',below:'Sous votre règle',above:'Au-dessus de votre règle'},zh:{sub:'个人食物组摄入比对',dis:'请自行录入食物和比较规则。本工具不提供医疗建议，也不代表官方膳食标准。',food:'食物摄入',rule:'我的比较规则',result:'比对结果',name:'食物名称',add:'添加食物',save:'保存规则',compare:'比对数量',none:'暂无录入',within:'符合自设规则',below:'低于自设范围',above:'高于自设范围'}};let lang=localStorage.lang||'en', foods=JSON.parse(localStorage.foods||'[]'),rules=JSON.parse(localStorage.rules||'{}'),cats=['meat','vegetables and fruits','grain tuber','milk and dairy products','sugary drink','salt','oil','not classified'];const $=s=>document.querySelector(s),catName={en:['Meat','Vegetables and fruits','Grains and tubers','Milk and dairy','Sugary drinks','Salt','Oil','Not classified'],fr:['Viande','Fruits et légumes','Céréales et tubercules','Laitages','Boissons sucrées','Sel','Huiles','Non classé'],zh:['肉类','蔬菜和水果','谷物和薯类','奶及乳制品','含糖饮料','盐','油','未分类']};function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let t=T[lang];document.documentElement.lang=lang;$('#language').value=lang;$('#subtitle').textContent=t.sub;$('#disclaimer').textContent=t.dis;$('#foodTitle').textContent=t.food;$('#ruleTitle').textContent=t.rule;$('#resultTitle').textContent=t.result;$('#foodName').placeholder=t.name;$('#addFood').textContent=t.add;$('#saveRule').textContent=t.save;$('#compare').textContent=t.compare;for(let id of ['foodCategory','ruleCategory'])$( '#'+id).innerHTML=cats.map((c,i)=>`<option value="${c}">${catName[lang][i]}</option>`).join('');$('#foods').innerHTML=foods.map((f,i)=>`<li>${esc(f.name)} · ${f.amount} ${f.unit} · ${catName[lang][cats.indexOf(f.category)]}<button data-x="${i}">×</button></li>`).join('')||`<li>${t.none}</li>`;$('#rules').innerHTML=Object.entries(rules).map(([c,r])=>`<li>${catName[lang][cats.indexOf(c)]}: ${r.min}–${r.max}</li>`).join('')||`<li>${t.none}</li>`}$('#language').onchange=e=>{lang=e.target.value;localStorage.lang=lang;render()};$('#foodForm').onsubmit=e=>{e.preventDefault();foods.push(Object.fromEntries(new FormData(e.target)));localStorage.foods=JSON.stringify(foods);e.target.reset();render()};$('#foods').onclick=e=>{if(e.target.dataset.x!=null){foods.splice(+e.target.dataset.x,1);localStorage.foods=JSON.stringify(foods);render()}};$('#ruleForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(+d.max<+d.min)return;rules[d.category]={min:+d.min,max:+d.max};localStorage.rules=JSON.stringify(rules);render()};$('#compare').onclick=()=>$('#results').innerHTML=cats.map((c,i)=>{if(!rules[c])return '';let n=foods.filter(f=>f.category===c).reduce((s,f)=>s+ +f.amount,0),r=rules[c],label=n<r.min?T[lang].below:n>r.max?T[lang].above:T[lang].within;return `<li>${catName[lang][i]}: ${n} (${r.min}–${r.max}) — <b class="${label===T[lang].within?'ok':'bad'}">${label}</b></li>`}).join('')||`<li>${T[lang].none}</li>`;render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
