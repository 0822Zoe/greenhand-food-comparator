<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b55"><link rel="manifest" href="./manifest.json"><title>GreenHand</title><style>body{font:16px system-ui;margin:0;background:#f3f7f4;color:#16392f}header{background:#176b55;color:white;padding:18px 5%;display:flex;justify-content:space-between}main{max-width:900px;margin:20px auto;padding:0 15px}.card{background:white;padding:18px;margin:14px 0;border-radius:14px}.note{background:#fff0c7;padding:14px;border-radius:12px}form{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}input,select,button{font:inherit;padding:10px;border:1px solid #ccd8d1;border-radius:8px}button{background:#176b55;color:white;border:0}li{padding:8px;border-bottom:1px solid #eee}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><div><b>GreenHand</b><div id="subtitle"></div></div><select id="lang"><option value="en">English</option><option value="fr">Français</option><option value="zh">中文</option></select></header><main><p class="note" id="disclaimer"></p><section class="card"><h2 id="authTitle"></h2><form id="auth"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="8" placeholder="Password (8+ characters)" required><button id="signup"></button><button id="signin"></button><button id="signout" type="button"></button></form><p id="status"></p></section><section class="card"><h2 id="foodTitle"></h2><form id="food"><input name="food_name" placeholder="Food name" required><select name="food_group"><option value="vegetables and fruits">Vegetables and fruits</option><option value="grains and tubers">Grains and tubers</option><option value="meat and alternatives">Meat and alternatives</option><option value="dairy">Dairy</option><option value="other">Other</option></select><input name="amount" type="number" min="0" step=".1" placeholder="Amount (g)" required><input name="salt_g" type="number" min="0" step=".01" placeholder="Salt (g, optional)"><input name="free_sugar_g" type="number" min="0" step=".1" placeholder="Free sugars (g)"><input name="energy_kcal" type="number" min="0" step="1" placeholder="Energy (kcal)"><input name="eaten_on" type="date"><button id="save"></button></form><ul id="entries"></ul></section><section class="card"><h2 id="whoTitle"></h2><button id="analyze"></button><div id="analysis"></div></section><section class="card"><h2 id="rulesTitle"></h2><form id="rule"><select name="food_group"><option>vegetables and fruits</option><option>grains and tubers</option><option>meat and alternatives</option><option>dairy</option><option>other</option></select><input name="min_amount" type="number" min="0" placeholder="Minimum g" required><input name="max_amount" type="number" min="0" placeholder="Maximum g" required><button id="saveRule"></button></form><ul id="rules"></ul></section></main><script>

Number(x.free_sugar_g||0),0),energy=a.reduce((s,x)=>s+Number(x.energy_kcal||0),0);$('#analysis').innerHTML=`<p>Fruit & vegetables: ${fruit} g / 400 g. ${fruit>=400?'Meets':'Below'} WHO reference for age >10. This compares entered weight only.</p><p>Salt: ${a.some(x=>x.salt_g!=null)?salt+' g / <5 g. '+(salt<5?'Within':'Above')+' reference.':'Not assessed: enter salt content.'}</p><p>Free sugars: ${energy&&a.some(x=>x.free_sugar_g!=null)?sug+' g / '+(energy*.1/4).toFixed(1)+' g approximate 10%-energy ceiling.':'Not assessed: enter free sugars and energy.'}</p>`};(async()=>{let {data}=await sb.auth.getSession();user=data.session?.user||null;text();if(user)load()})();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
